version: '3.9'

# ── MES Line Side Board v2 — Full Stack ───────────────────────────────────────
# Three services:
#   1. backend-java  — Spring Boot 3  (MARS SQL Server + Robot press poller)
#   2. backend-go    — Go HTTP server  (PostgreSQL queries + proxy to Java)
#   3. frontend      — Vite dev server (proxies /api → Go in dev mode)
#                       OR served as static files by Go in production
#
# Usage:
#   dev:   docker compose up           (all 3 services, hot-reload friendly)
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Required environment variables (copy .env.example → .env and fill in):
#   See each service's .env section below.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Java microservice (MARS + Robot Press) ──────────────────────────────────
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: lsb-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./config/.env
    environment:
      # MARS SQL Server
      MARS_DB_HOST:     ${MARS_DB_HOST:-192.168.1.100}
      MARS_DB_PORT:     ${MARS_DB_PORT:-1433}
      MARS_DB_NAME:     ${MARS_DB_NAME:-MARS}
      MARS_DB_USER:     ${MARS_DB_USER:-marsuser}
      MARS_DB_PASS:     ${MARS_DB_PASS:-changeme}
      # Robot air press
      ROBOT_PRESS_URL:      ${ROBOT_PRESS_URL:-http://192.168.1.200/api/status}
      ROBOT_PRESS_POLL_MS:  ${ROBOT_PRESS_POLL_MS:-10000}
      ROBOT_PRESS_FORCE_MIN: ${ROBOT_PRESS_FORCE_MIN:-12.0}
      ROBOT_PRESS_FORCE_MAX: ${ROBOT_PRESS_FORCE_MAX:-18.0}
      # Plant
      RESOURCE_ID:  ${RESOURCE_ID:-WM15}
      SHIFT_NUM:    ${SHIFT_NUM:-2}
      JPH_TARGET:   ${JPH_TARGET:-23}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/mars/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lsb-net

  # ── Go API gateway ───────────────────────────────────────────────────────────
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: lsb-go
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./config/.env
    depends_on:
      backend-java:
        condition: service_healthy
    environment:
      # PostgreSQL (mesdb)
      DB_HOST:  ${DB_HOST:-192.168.1.126}
      DB_PORT:  ${DB_PORT:-5432}
      DB_NAME:  ${DB_NAME:-mesdb}
      DB_USER:  ${DB_USER:-mesapp}
      DB_PASS:  ${DB_PASS:-changeme}
      PORT:     3001
      CORS_SUBNET: ${CORS_SUBNET:-192.168.1.0/24}
      # Plant
      RESOURCE_ID:    ${RESOURCE_ID:-WM15}
      PART_NUMBER:    ${PART_NUMBER:-BMW1000D-360}
      OPERATOR_NAME:  ${OPERATOR_NAME:-Yashwanta Thakur}
      JPH_TARGET:     ${JPH_TARGET:-23}
      SHIFT_NUM:      ${SHIFT_NUM:-2}
      PROD_TABLE:     ${PROD_TABLE:-production_log}
      DT_TABLE:       ${DT_TABLE:-downtime_log}
      ISSUES_TABLE:   ${ISSUES_TABLE:-open_issues}
      # Java sidecar
      JAVA_SERVICE_URL: http://backend-java:8080
      LSB_JAVA_URL: http://backend-java:8080
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lsb-net

  # ── React frontend (dev mode) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lsb-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend-go
    volumes:
      - ./frontend/src:/app/src         # hot-reload
      - ./frontend/index.html:/app/index.html
    environment:
      VITE_API_BASE: http://backend-go:3001
    networks:
      - lsb-net

networks:
  lsb-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
