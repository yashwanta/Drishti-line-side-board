# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=mars-service

# ── MARS SQL Server ───────────────────────────────────────────────────────────
# Set these via environment variables in production / docker-compose
mars.datasource.url=jdbc:sqlserver://${MARS_DB_HOST:192.168.1.100}:${MARS_DB_PORT:1433};databaseName=${MARS_DB_NAME:MARS};encrypt=false;trustServerCertificate=true
mars.datasource.username=${MARS_DB_USER:marsuser}
mars.datasource.password=${MARS_DB_PASS:YOUR_MARS_PASSWORD}
mars.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── Robot Air Press Pendant ───────────────────────────────────────────────────
# REST JSON endpoint on the pendant (e.g. http://192.168.1.200/api/status)
robotpress.pendant.url=${ROBOT_PRESS_URL:http://192.168.1.200/api/status}
robotpress.poll.interval.ms=${ROBOT_PRESS_POLL_MS:10000}
# Tolerance band for pass/fail (kN)
robotpress.force.min=${ROBOT_PRESS_FORCE_MIN:12.0}
robotpress.force.max=${ROBOT_PRESS_FORCE_MAX:18.0}

# ── Plant config ──────────────────────────────────────────────────────────────
plant.resource.id=${RESOURCE_ID:WM15}
plant.shift.num=${SHIFT_NUM:2}
plant.jph.target=${JPH_TARGET:23}

# ── Connection pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.mes.mars=INFO
logging.level.org.springframework.jdbc=WARN
